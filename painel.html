<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Meus Condomínios — Conta Sim Digital</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="logo-chip"><img src="assets/img/logo-consigaz.png" alt="Consigaz"></div>
    <div class="brand" style="font-size:15px;">Conta Sim Digital</div>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" style="color:#fff;" onclick="sair()">Sair</button>
  </div>

  <div class="screen">
    <div id="perfilInfo" class="card" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h3 id="perfilNome" style="margin-bottom:2px;"></h3>
          <p class="muted" id="perfilTipo" style="margin:0; font-size:14px;"></p>
        </div>
        <span class="badge badge-neutral" id="perfilBadge"></span>
      </div>
      <div id="conviteBox" style="display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
        <p style="margin-bottom:8px; font-size:14px;">Código de convite (para seus ajudantes):</p>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="mono" style="font-size:22px; font-weight:700; letter-spacing:3px; color: var(--flame-dark);" id="codigoConvite"></span>
          <button class="btn btn-outline btn-sm" onclick="copiarParaAreaTransferencia(document.getElementById('codigoConvite').textContent)">Copiar</button>
        </div>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <h2 style="margin:0;">Condomínios</h2>
      <button class="btn btn-primary btn-sm" id="btnNovoCondominio" onclick="document.getElementById('modalNovo').style.display='flex'">+ Novo</button>
    </div>

    <div id="listaCondominios" class="stack"></div>
    <div id="vazio" class="empty-state" style="display:none;">
      <p>Nenhum condomínio cadastrado ainda.</p>
    </div>
  </div>
</div>

<!-- Modal criar condomínio -->
<div id="modalNovo" style="display:none; position:fixed; inset:0; background:rgba(11,41,71,0.6); align-items:flex-end; justify-content:center; z-index:50;">
  <div class="card" style="width:100%; max-width:480px; border-radius:24px 24px 0 0; margin:0;">
    <h3>Novo condomínio</h3>
    <form id="formNovoCondominio">
      <div class="field">
        <label for="novoNome">Nome do condomínio</label>
        <input type="text" id="novoNome" required>
      </div>
      <div class="field">
        <label for="novoEndereco">Endereço</label>
        <input type="text" id="novoEndereco">
      </div>
      <div class="field">
        <label for="novoEstrutura">Estrutura do edifício</label>
        <select id="novoEstrutura">
          <option value="apto_simples">Só apartamentos (sem torre/bloco)</option>
          <option value="torre_bloco_apto">Tem torre e/ou bloco</option>
        </select>
        <div class="hint">Se não tiver certeza, escolha "só apartamentos" — você importa a planilha na próxima tela e o sistema detecta automaticamente.</div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="button" class="btn btn-outline" onclick="document.getElementById('modalNovo').style.display='none'">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnCriarCondominio">Criar</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/supabase-client.js"></script>
<script>
let perfilAtual = null;

async function carregarPainel() {
  await exigirSessao();
  perfilAtual = await obterPerfil();

  if (!perfilAtual) {
    // Usuário autenticado no Auth mas sem finalizar cadastro (raro) — volta pro login
    await sair();
    return;
  }

  document.getElementById('perfilInfo').style.display = 'block';
  document.getElementById('perfilNome').textContent = perfilAtual.nome;
  document.getElementById('perfilBadge').textContent = perfilAtual.tipo === 'consultor' ? 'Consultor' : 'Ajudante';

  if (perfilAtual.tipo === 'consultor') {
    document.getElementById('perfilTipo').textContent = 'Responsável pelos condomínios abaixo';
    document.getElementById('conviteBox').style.display = 'block';
    document.getElementById('codigoConvite').textContent = perfilAtual.codigo_convite;
  } else {
    document.getElementById('perfilTipo').textContent = 'Ajudando na coleta de dados';
    document.getElementById('btnNovoCondominio').style.display = 'none';
  }

  await carregarCondominios();
}

async function carregarCondominios() {
  const { data, error } = await sb.from('csd_condominios').select('*').order('nome');
  const lista = document.getElementById('listaCondominios');
  lista.innerHTML = '';

  if (error || !data || data.length === 0) {
    document.getElementById('vazio').style.display = 'block';
    return;
  }
  document.getElementById('vazio').style.display = 'none';

  for (const c of data) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cursor = 'pointer';
    card.onclick = () => window.location.href = 'condominio.html?id=' + c.id;
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h3 style="margin-bottom:4px;">${escapeHtml(c.nome)}</h3>
          <p class="muted" style="margin:0; font-size:14px;">${escapeHtml(c.endereco || 'Endereço não informado')}</p>
        </div>
        <span class="badge badge-neutral">${c.estrutura === 'torre_bloco_apto' ? 'Torre/Bloco' : 'Apto'}</span>
      </div>
    `;
    lista.appendChild(card);
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

document.getElementById('formNovoCondominio').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnCriarCondominio');
  setBtnLoading(btn, true);

  const nome = document.getElementById('novoNome').value.trim();
  const endereco = document.getElementById('novoEndereco').value.trim();
  const estrutura = document.getElementById('novoEstrutura').value;

  const { data, error } = await sb.from('csd_condominios')
    .insert({ nome, endereco, estrutura, consultor_id: perfilAtual.id })
    .select().single();

  setBtnLoading(btn, false, 'Criar');

  if (error) {
    toast('Erro ao criar condomínio.', 'error');
    return;
  }
  window.location.href = 'condominio.html?id=' + data.id;
});

carregarPainel();
</script>
</body>
</html>
